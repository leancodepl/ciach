name: Score and report pana result
description: Run pana on a package, emit score outputs, summarize results, and report commit status.

inputs:
  package:
    description: Package path or name to analyze with pana.
    required: true

outputs:
  score:
    description: 'Package name and score, e.g. "my-package: 98/100".'
    value: ${{ steps.score.outputs.score }}
  state:
    description: Commit status state based on pana score.
    value: ${{ steps.score.outputs.state }}

runs:
  using: composite
  steps:
    - name: Score the package
      id: score
      shell: bash
      continue-on-error: true
      env:
        PACKAGE_INPUT: ${{ inputs.package }}
      run: |
        set -euo pipefail # so tee doesn't mask a pana that fell over
        pana --json "$PACKAGE_INPUT" | tee "$RUNNER_TEMP/pana.json" || true

        granted=$(jq '.scores.grantedPoints' "$RUNNER_TEMP/pana.json")
        max=$(jq '.scores.maxPoints' "$RUNNER_TEMP/pana.json")

        # Two nulls would compare equal and read as a full score.
        case "$granted$max" in
          '' | *[!0-9]*)
            echo "::error title=pana score::no score in pana's JSON report"
            exit 1
            ;;
        esac

        package_name="$PACKAGE_INPUT"
        if [ -d "$PACKAGE_INPUT" ] && [ -f "$PACKAGE_INPUT/pubspec.yaml" ]; then
          parsed_name="$(sed -n 's/^name:[[:space:]]*//p' "$PACKAGE_INPUT/pubspec.yaml" | head -n 1)"
          if [ -n "$parsed_name" ]; then
            package_name="$parsed_name"
          fi
        fi

        echo "score=$package_name: $granted/$max" >> "$GITHUB_OUTPUT"
        if [ "$granted" = "$max" ]; then
          echo 'state=success' >> "$GITHUB_OUTPUT"
        else
          echo 'state=failure' >> "$GITHUB_OUTPUT"
        fi

        {
          echo "## pana score: $package_name: $granted/$max"
          echo
          jq -r '.report.sections[]
            | "- \(if .grantedPoints == .maxPoints then ":white_check_mark:" else ":x:" end) \(.title): \(.grantedPoints)/\(.maxPoints)"' \
          "$RUNNER_TEMP/pana.json"

          if [ "$granted" != "$max" ]; then
            echo
            echo '<details><summary>Deductions</summary>'
            echo
            jq -r '.report.sections[]
              | select(.grantedPoints < .maxPoints)
              | .summary' "$RUNNER_TEMP/pana.json"
            echo
            echo '</details>'
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Report the score
      shell: bash
      continue-on-error: true
      # A fork's token can't write statuses.
      if: |
        always() && (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
      env:
        GH_TOKEN: ${{ github.token }}
        # The pull request head, not the merge commit `github.sha` names.
        SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        STATE: ${{ steps.score.outputs.state || 'error' }}
        SCORE: ${{ steps.score.outputs.score || 'pana produced no score' }}
      run: |
        gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
          --silent \
          -f state="$STATE" \
          -f context='pana' \
          -f description="$SCORE" \
          -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
