name: website

# Verifies the landing page builds. Hosting is on Vercel (ciach.leancode.co),
# which builds and deploys from its own integration; see website/README.md.
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analyze and build site

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: website

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Dart
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
        with:
          sdk: '3.13'

      - name: Download pub dependencies
        run: dart pub get

      - name: Run analyzer
        run: dart analyze --fatal-infos

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Install Jaspr CLI
        run: dart pub global activate jaspr_cli 0.23.4

      - name: Build static site
        # Same commands Vercel runs, minus the SDK download.
        run: |
          jaspr build --sitemap-domain https://ciach.leancode.co --dart-define=SITE_URL=https://ciach.leancode.co
          test -f build/jaspr/index.html
          test -f build/jaspr/sitemap.xml
