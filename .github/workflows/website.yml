name: website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'pubspec.yaml'
      - '.github/workflows/website.yml'
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Dart
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
        with:
          sdk: '3.13'

      - name: Configure GitHub Pages
        # Resolves the public URL (https://<owner>.github.io/<repo> or a
        # custom domain) so the canonical, Open Graph and sitemap URLs match
        # wherever the site is served from.
        if: github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@v5

      - name: Download pub dependencies
        working-directory: website
        run: dart pub get

      - name: Analyze
        working-directory: website
        run: dart analyze --fatal-infos

      - name: Check formatting
        working-directory: website
        run: dart format --set-exit-if-changed .

      - name: Install Jaspr CLI
        run: dart pub global activate jaspr_cli 0.23.4

      - name: Build static site
        working-directory: website
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url || 'https://leancodepl.github.io/ciach' }}
        run: |
          jaspr build --sitemap-domain "$SITE_URL" --dart-define=SITE_URL="$SITE_URL"
          # Deploy only the rendered page and its assets, not build_runner's
          # intermediate package sources.
          rm -rf build/jaspr/packages build/jaspr/.dart_tool build/jaspr/.build.manifest
          printf 'Sitemap: %s/sitemap.xml\n' "$SITE_URL" >> build/jaspr/robots.txt
          ls -R build/jaspr

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/build/jaspr

  deploy:
    name: Deploy to GitHub Pages

    if: github.event_name != 'pull_request'
    needs: build

    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
