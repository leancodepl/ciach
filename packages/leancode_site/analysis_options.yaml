include: ../../analysis_options.yaml

linter:
  rules:
    # Sites that pin the published jaspr 0.23 build with analyzer 12 cannot
    # parse primary constructors, so the package keeps classic constructors
    # until jaspr publishes a builder for analyzer 13.
    use_primary_constructors: false
    unnecessary_primary_constructor_body: false
    unnecessary_type_name_in_constructor: false

plugins:
  jaspr_lints:
    git:
      url: https://github.com/schultek/jaspr
      path: packages/jaspr_lints
      ref: 9311973c7261b4a37ee2cb526466aa6934854851
    diagnostics:
      prefer_html_components: true
      prefer_styles_getter: true
      sort_children_last: true
      styles_ordering: true
      unsafe_imports: true
