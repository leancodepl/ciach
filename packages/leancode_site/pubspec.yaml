name: leancode_site
description: >-
  The LeanCode design system for Jaspr sites: the palette and tokens, the base
  styles, the shared components and the plumbing a package landing page needs.
version: 0.1.0
repository: https://github.com/leancodepl/ciach/tree/main/packages/leancode_site
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  collection: ^1.19.1
  image: ^4.9.2
  jaspr: ^0.23.4
  jaspr_class_scope: ^0.1.1
  path: ^1.9.0
  puppeteer: ^3.26.0
  syntax_highlight_lite: ^0.0.1
  test: ^1.31.1
  universal_web: ^1.1.0

dev_dependencies:
  build_runner: ^2.10.0
  jaspr_builder: ^0.23.4
  jaspr_class_scope_builder: ^0.1.0
  leancode_lint: ^28.0.0

# The head of jaspr's `next` branch, the same commit as in website/pubspec.yaml,
# so that the package's own `build_runner` writes the same scope files as the
# site's build.
dependency_overrides:
  jaspr:
    git:
      url: https://github.com/schultek/jaspr
      path: packages/jaspr
      ref: 9311973c7261b4a37ee2cb526466aa6934854851
  jaspr_builder:
    git:
      url: https://github.com/schultek/jaspr
      path: packages/jaspr_builder
      ref: 9311973c7261b4a37ee2cb526466aa6934854851
