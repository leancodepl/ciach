name: ciach
description: >-
  Dead code detector for Dart and Flutter. Finds unused classes, functions,
  methods, fields and enum values that nothing references, and removes them.
# Keep in sync with `ciachVersion` in lib/src/version.dart.
version: 0.7.1
repository: https://github.com/leancodepl/ciach
homepage: https://ciach.leancode.co
issue_tracker: https://github.com/leancodepl/ciach/issues
topics:
  - static-analysis
  - dead-code
  - linter
  - cli
  - developer-tools

environment:
  sdk: ^3.10.0

dependencies:
  args: ^2.7.0
  cli_util: ^0.6.0
  collection: ^1.19.0
  config: ^0.9.0
  glob: ^2.2.0
  logging: ^1.3.0
  package_config: ">=2.1.0 <4.0.0"
  path: ^1.9.1
  pro_lsp: ^0.3.0
  stream_channel: ^2.1.4
  xml: ">=6.6.0 <8.0.0"
  yaml: ^3.1.3

dev_dependencies:
  leancode_lint: ^28.0.0
  test: ^1.31.2

executables:
  ciach:
