name: ciach_website
description: The ciach landing page, a statically generated Jaspr site.
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  collection: ^1.19.1
  jaspr: ^0.23.4
  jaspr_class_scope: ^0.1.1
  jaspr_content: ^0.5.4
  jaspr_router: ^0.9.0
  # The design system package, pinned to a commit of its repository.
  leancode_site:
    git:
      url: https://github.com/leancodepl/leancode-jaspr-ds
      ref: 23c1b2ff5f8ee9ea24343505d2cdb2db2a24db56

dev_dependencies:
  build_runner: ^2.10.0
  build_web_compilers: ^4.8.5
  jaspr_builder: ^0.23.4
  jaspr_class_scope_builder: ^0.1.0
  leancode_lint: ^28.0.0
  markdown: ^7.3.1
  test: ^1.31.1

# The head of jaspr's `next` branch, whose builder supports analyzer 13 and
# newer. Keep the commit the same as for `jaspr_cli` in vercel.json and for
# `jaspr_lints` in analysis_options.yaml, and go back to the version
# constraints above once it is published.
dependency_overrides:
  jaspr:
    git:
      url: https://github.com/schultek/jaspr
      path: packages/jaspr
      ref: 9311973c7261b4a37ee2cb526466aa6934854851
  jaspr_builder:
    git:
      url: https://github.com/schultek/jaspr
      path: packages/jaspr_builder
      ref: 9311973c7261b4a37ee2cb526466aa6934854851
  jaspr_content:
    git:
      url: https://github.com/schultek/jaspr
      path: packages/jaspr_content
      ref: 9311973c7261b4a37ee2cb526466aa6934854851
  jaspr_router:
    git:
      url: https://github.com/schultek/jaspr
      path: packages/jaspr_router
      ref: 9311973c7261b4a37ee2cb526466aa6934854851

jaspr:
  mode: static
