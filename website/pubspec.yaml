name: ciach_website
description: The ciach landing page, a statically generated Jaspr site.
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  jaspr: ^0.23.4
  syntax_highlight_lite: ^0.0.1
  universal_web: ^1.1.0

dev_dependencies:
  build_runner: ^2.10.0
  # 4.8.6+ is compiled against analyzer 13, and the analyzer override below
  # hides that from pub; without the cap pub picks 4.8.10 and the build
  # fails to compile. Lift both together with the next jaspr release.
  build_web_compilers: '>=4.8.5 <4.8.6'
  jaspr_builder: ^0.23.4
  leancode_lint: ^27.0.0

dependency_overrides:
  # jaspr_builder 0.23 needs analyzer 12 and does not compile against newer
  # ones; leancode_lint wants 13+, but only its analysis_options.yaml is
  # consumed here (its plugin is resolved separately by the analysis server).
  analyzer: ^12.1.0

jaspr:
  mode: static
