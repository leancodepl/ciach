name: ciach_website
description: The ciach landing page, a statically generated Jaspr site.
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  jaspr: ^0.23.4
  universal_web: ^1.1.0

dev_dependencies:
  build_runner: ^2.10.0
  # jaspr_builder 0.23 pins analyzer ^12, which build_web_compilers 4.8.6+
  # no longer accepts. Lift the cap together with the next jaspr release.
  build_web_compilers: '>=4.8.5 <4.8.6'
  jaspr_builder: ^0.23.4
  # leancode_lint needs analyzer 13 too, so the site uses the core lint set.
  lints: ^6.0.0

jaspr:
  mode: static
