name: ciach_website
description: The ciach landing page, a statically generated Jaspr site.
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  jaspr: ^0.23.4
  syntax_highlight_lite: ^0.0.1
  universal_web: ^1.1.0

dev_dependencies:
  build_runner: ^2.10.0
  # jaspr_builder 0.23 pins analyzer ^12, which build_web_compilers 4.8.6+
  # no longer accepts. Lift the cap together with the next jaspr release.
  build_web_compilers: '>=4.8.5 <4.8.6'
  jaspr_builder: ^0.23.4
  leancode_lint: ^27.0.0

dependency_overrides:
  # Only leancode_lint's analysis_options.yaml is consumed here; its lint
  # plugin runs in the analysis server. jaspr_builder needs analyzer 12.
  analyzer: ^12.1.0

jaspr:
  mode: static
