name: ciach_lints
description: Analyzer plugin with lint rules specific to the ciach repository.
publish_to: none

environment:
  sdk: ^3.13.0

# The analysis server builds every plugin of a package into one package, so
# these must stay resolvable together with leancode_lint's constraints at the
# root and with jaspr_lints's (analyzer 12) in website/.
dependencies:
  analysis_server_plugin: '>=0.3.14 <0.4.0'
  analyzer: '>=12.1.0 <15.0.0'
  analyzer_plugin: '>=0.14.8 <0.15.0'
  yaml: ^3.1.3

dev_dependencies:
  analyzer_testing: ^0.4.2
  leancode_lint: ^27.0.0
  test: ^1.31.2
  test_reflective_loader: ^0.4.0
