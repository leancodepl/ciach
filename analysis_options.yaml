# Every other package in the repository includes this file, so that all of
# them run the same lint rules and plugins.
include: package:leancode_lint/analysis_options.yaml

plugins:
  leancode_lint:
    version: ^28.0.0
    diagnostics:
      cognitive_complexity: true
      prefer_dot_shorthand: true
  ciach_lints:
    path: tool/ciach_lints
